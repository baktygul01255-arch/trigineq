<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Кеңістіктегі арақашықтық</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap">
<style>
/* Layout: school-notebook sheet on graph paper. Sticky header, pill tabs, one card per topic
   (text left, rotatable 3D figure right), reference grid, floating pen toolbar over an ink layer. */
:root{
  --u:1.25; --k:1.15; --ul:1.12;
  --paper:#f6f8fd; --grid:#dde5f4; --surface:#ffffff; --surface-2:#eef3fc;
  --ink:#142040; --ink-2:#4b5979; --rule:#ccd6ea;
  --accent:#2447c5; --accent-ink:#ffffff; --accent-soft:rgba(36,71,197,.12);
  --margin:#d63e4f;
  --plane-a:rgba(36,71,197,.17); --edge-a:#2447c5;
  --plane-b:rgba(214,62,79,.17); --edge-b:#d63e4f;
  --plane-c:rgba(17,122,85,.17); --edge-c:#117a55;
  --good:#117a55; --good-soft:rgba(17,122,85,.12); --bad:#c2303f; --bad-soft:rgba(194,48,63,.11);
  --pen-1:#1b3fd0; --pen-2:#d3263f; --pen-3:#0f8a5f;
  --font-display:'Source Serif 4','Noto Serif',Georgia,serif;
  --font-ui:'IBM Plex Sans','Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1526; --grid:#1a2742; --surface:#141d33; --surface-2:#1a2542;
    --ink:#e8eefc; --ink-2:#a2b2d4; --rule:#2b3b60;
    --accent:#86a6ff; --accent-ink:#0e1526; --accent-soft:rgba(134,166,255,.17);
    --margin:#ff8591;
    --plane-a:rgba(134,166,255,.20); --edge-a:#86a6ff;
    --plane-b:rgba(255,133,145,.20); --edge-b:#ff8591;
    --plane-c:rgba(95,211,161,.20); --edge-c:#5fd3a1;
    --good:#5fd3a1; --good-soft:rgba(95,211,161,.14); --bad:#ff8591; --bad-soft:rgba(255,133,145,.13);
    --pen-1:#8fb0ff; --pen-2:#ff8a98; --pen-3:#5fd3a1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1526; --grid:#1a2742; --surface:#141d33; --surface-2:#1a2542;
  --ink:#e8eefc; --ink-2:#a2b2d4; --rule:#2b3b60;
  --accent:#86a6ff; --accent-ink:#0e1526; --accent-soft:rgba(134,166,255,.17);
  --margin:#ff8591;
  --plane-a:rgba(134,166,255,.20); --edge-a:#86a6ff;
  --plane-b:rgba(255,133,145,.20); --edge-b:#ff8591;
  --plane-c:rgba(95,211,161,.20); --edge-c:#5fd3a1;
  --good:#5fd3a1; --good-soft:rgba(95,211,161,.14); --bad:#ff8591; --bad-soft:rgba(255,133,145,.13);
  --pen-1:#8fb0ff; --pen-2:#ff8a98; --pen-3:#5fd3a1;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font:400 calc(16px*var(--u))/1.5 var(--font-ui); -webkit-text-size-adjust:100%;
}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{width:100%;max-width:calc(1080px*var(--u));margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{padding-block:0 110px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand-txt{min-width:0}
.brand-t{font:600 calc(21px*var(--ul))/1.1 var(--font-display);letter-spacing:-.01em;white-space:nowrap}
.brand-s{font-size:calc(12.5px*var(--u));color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{flex-wrap:wrap;display:flex;align-items:center;gap:8px;flex:none}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink-2);font:600 calc(13px*var(--u)) var(--font-ui);padding:0 11px;min-height:calc(38px*var(--k));cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{width:calc(38px*var(--k));height:calc(38px*var(--k));display:grid;place-items:center;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.icon-btn svg,.tool svg{display:block}

/* tabs */
.tabs{display:flex;gap:8px;padding-block:14px 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);font:600 calc(15px*var(--u)) var(--font-ui);padding:0 16px;min-height:calc(42px*var(--k));border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* sheet */
.sheet{position:relative}
.stack{display:grid;gap:16px;padding-block:12px 24px}
.intro{margin:6px 0 0;max-width:64ch;color:var(--ink-2);font-size:calc(15.5px*var(--u))}
.src-note{margin:0;font-size:calc(12.5px*var(--u));color:var(--ink-2)}
.legend{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:0 14px}
.legend summary{cursor:pointer;font-weight:600;min-height:calc(46px*var(--k));display:flex;align-items:center}
.legend-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 18px;padding:2px 0 14px;margin:0;list-style:none}
.legend-g li{display:flex;gap:10px;align-items:baseline;min-width:0}
.legend-g b{font:italic 600 calc(17px*var(--u)) var(--font-display);white-space:nowrap;min-width:5.4em}
.legend-g span{font-size:calc(14px*var(--u));color:var(--ink-2)}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:820px){.card{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);padding:24px;gap:30px}}
.c-text{display:flex;flex-direction:column;gap:14px;min-width:0}
.c-head{display:flex;align-items:center;gap:10px}
.tag{flex:none;background:var(--accent);color:var(--accent-ink);font:700 calc(14px*var(--u)) var(--font-ui);letter-spacing:.03em;padding:4px 10px;border-radius:8px;white-space:nowrap}
.c-head h2{margin:0;font:600 calc(22px*var(--u))/1.2 var(--font-display);text-wrap:balance}
.stmt{margin:0;font:400 calc(19px*var(--u))/1.5 var(--font-display);max-width:58ch}
.defs{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:calc(15px*var(--u));color:var(--ink-2);max-width:60ch}
.sym{margin:0;background:var(--surface-2);border-radius:10px;padding:10px 12px;font:italic 400 calc(17px*var(--u))/1.5 var(--font-display);overflow-wrap:anywhere}
.sym small{display:block;font:600 calc(11px*var(--u)) var(--font-ui);font-style:normal;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.real{border-top:1px dashed var(--rule);padding-top:12px}
.real small{font:600 calc(11px*var(--u)) var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--margin)}
.real p{margin:2px 0 0;font-size:calc(15px*var(--u));color:var(--ink-2);max-width:58ch}
.extra{margin:0;border-top:1px dashed var(--rule);padding-top:12px;font-size:calc(15px*var(--u));max-width:60ch}
.extra b{font-weight:600}
.proof{border-top:1px dashed var(--rule);padding-top:4px}
.proof summary{cursor:pointer;font-weight:600;min-height:calc(44px*var(--k));display:flex;align-items:center}
.proof ol{margin:0;padding-left:1.3em;display:grid;gap:8px;font-size:calc(15.5px*var(--u));max-width:60ch}
.proof li::marker{font-weight:600;color:var(--ink-2)}
.ref{display:inline-block;font:700 calc(12px*var(--u)) var(--font-ui);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;margin-left:4px;white-space:nowrap}

/* figure */
.c-fig{min-width:0}
.fig{margin:0;background:var(--surface-2);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.fig svg.grab{cursor:grabbing}
.fig figcaption{padding:10px 14px;border-top:1px solid var(--rule);font-size:calc(14.5px*var(--u));line-height:1.45;color:var(--ink-2);min-height:5.2em}
.counts{display:flex;gap:8px;margin-top:10px}
.count{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--rule);border-radius:10px;padding:6px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.count span{font-size:calc(12.5px*var(--u));color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.count b{font:600 calc(22px*var(--u)) var(--font-display);font-variant-numeric:tabular-nums}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mode{border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);font:600 calc(13.5px*var(--u)) var(--font-ui);border-radius:999px;padding:0 14px;min-height:calc(38px*var(--k));cursor:pointer}
.mode[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.slider{display:flex;align-items:center;gap:12px;margin-top:10px;font-weight:600;font-size:calc(14px*var(--u))}
.slider span{white-space:nowrap;min-width:4.2em;font-variant-numeric:tabular-nums}
.slider input{flex:1;min-width:0;accent-color:var(--accent);min-height:calc(30px*var(--k))}
.fig-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;font-size:calc(12.5px*var(--u));color:var(--ink-2)}
.link-btn{border:0;background:transparent;color:var(--accent);font:600 calc(13px*var(--u)) var(--font-ui);cursor:pointer;min-height:calc(36px*var(--k));padding:0 4px}
.pl-a{fill:var(--plane-a);stroke:var(--edge-a);stroke-width:1.5;stroke-linejoin:round}
.pl-b{fill:var(--plane-b);stroke:var(--edge-b);stroke-width:1.5;stroke-linejoin:round}
.pl-c{fill:var(--plane-c);stroke:var(--edge-c);stroke-width:1.5;stroke-linejoin:round}
.pl-f{fill:var(--plane-a);stroke:none}
.ln{fill:none;stroke-linecap:round}
.ln-ink{stroke:var(--ink)} .ln-accent{stroke:var(--accent)} .ln-faint{stroke:var(--ink-2)}
.pt{fill:var(--ink);stroke:var(--surface-2);stroke-width:2}
.lbl{font:italic 600 calc(18px*var(--ul)) var(--font-display);fill:var(--ink);text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:var(--surface-2);stroke-width:3px}
.lbl-h{fill:var(--ink-2)}
.lbl-a{fill:var(--edge-a)} .lbl-b{fill:var(--edge-b)} .lbl-c{fill:var(--edge-c)} .lbl-ln{fill:var(--accent)}
.lbl-pl{font-size:calc(21px*var(--ul))}

/* reference */
.ref-tools{display:grid;gap:10px}
.search{width:100%;min-height:calc(46px*var(--k));border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font:500 calc(16px*var(--u)) var(--font-ui);padding:0 14px}
.search::placeholder{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rgroup{display:grid;gap:10px}
.rgroup h3{margin:6px 0 0;font:600 calc(13px*var(--u)) var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.rc{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.symbtn{border:1px solid var(--rule);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:4px 12px;min-height:calc(44px*var(--k));max-width:100%;font:italic 600 calc(24px*var(--u))/1.2 var(--font-display);cursor:pointer;text-align:left;overflow-wrap:anywhere}
.symbtn:hover{border-color:var(--accent)}
.rc-term{font:600 calc(20px*var(--u))/1.25 var(--font-display)}
.rc-src{flex:none;font:700 calc(12px*var(--u)) var(--font-ui);color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.rc-txt{margin:0;font-size:calc(15px*var(--u))}
.rc-ex{margin:0;font:italic calc(15.5px*var(--u)) var(--font-display);color:var(--ink-2);overflow-wrap:anywhere}
.rc-alt{margin:0;font-size:calc(13.5px*var(--u));color:var(--ink-2)}
.empty{padding:28px 12px;text-align:center;color:var(--ink-2)}

/* quiz */
.quiz{max-width:720px;grid-template-columns:minmax(0,1fr)!important;gap:16px}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.prog i.on{background:var(--accent)}
.q-n{font-size:calc(13px*var(--u));color:var(--ink-2);font-weight:600}
.q-t{margin:0;font:600 calc(21px*var(--ul))/1.35 var(--font-display);text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font:500 calc(16px*var(--u))/1.4 var(--font-ui);cursor:pointer;min-height:calc(50px*var(--k))}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font-size:calc(12px*var(--u));font-weight:700;color:var(--ink-2)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin:0;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:calc(15px*var(--u))}
.fb b.ok{color:var(--good)} .fb b.bad{color:var(--bad)}
.btn{align-self:flex-start;border:0;background:var(--accent);color:var(--accent-ink);font:600 calc(15px*var(--u)) var(--font-ui);padding:0 20px;min-height:calc(46px*var(--k));border-radius:12px;cursor:pointer}
.score{font:600 calc(40px*var(--u))/1 var(--font-display)}

/* pen */
#ink{position:absolute;left:0;top:0;z-index:5;pointer-events:none}
body[data-tool="pen"] #ink,body[data-tool="line"] #ink,body[data-tool="eraser"] #ink{pointer-events:auto;touch-action:none;cursor:crosshair}
body[data-tool="eraser"] #ink{cursor:cell}
.pen{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.pen-bar{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;padding:6px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 28px rgba(8,16,40,.22)}
.tool{width:calc(38px*var(--k));height:calc(38px*var(--k));display:grid;place-items:center;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;padding:0}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool.armed{background:var(--bad);color:#fff}
.tool .dot{display:block;border-radius:50%;background:currentColor}
.tool.sw .dot{width:20px;height:20px}
.tool.sw[aria-pressed="true"]{background:transparent;border-color:var(--ink)}
.sep{width:1px;height:24px;background:var(--rule);margin:0 3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:45;max-width:min(92vw,420px);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-size:calc(14px*var(--u));line-height:1.35;text-align:center;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.ang-f{fill:var(--plane-b);stroke:none}
.ang-s{fill:none;stroke:var(--edge-b);stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.ln-b{stroke:var(--edge-b)} .ln-c{stroke:var(--edge-c)}
.lbl-ang{font-size:calc(17px*var(--ul))}
.brand-t{white-space:normal}
.legend-g{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.legend-g b{min-width:0;white-space:normal;flex:none;max-width:45%}
.tab{max-width:calc(100vw - 32px);white-space:normal;line-height:1.25;padding-block:6px}
.brand-t,.brand-s,.c-head h2,.c-text,.stmt,.defs li,.sym{min-width:0;overflow-wrap:break-word;hyphens:auto}

.ln-a{stroke:var(--edge-a)}
.sol-f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.sol-f>label,.sol-o legend{font-weight:700;font-size:calc(calc(14px*var(--u))*var(--u));color:var(--ink-2)}
.sol select,.sol input[type=number]{width:100%;min-width:0;min-height:calc(44px*var(--k));border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font:500 calc(calc(16px*var(--u))*var(--u)) var(--font-ui);padding:0 12px}
.sol select:focus-visible,.sol input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sol input[aria-invalid="true"]{border-color:var(--edge-b)}
.sol-par{display:flex;flex-wrap:wrap;gap:10px}
.sol-n span{white-space:nowrap}.sol select{font-size:calc(calc(14.5px*var(--u))*var(--u))}
.sol-n{display:flex;align-items:center;gap:8px;flex:1 1 130px;min-width:0;font-weight:700;font-size:calc(calc(15px*var(--u))*var(--u))}
.sol-hint{color:var(--ink-2);font-size:calc(calc(13px*var(--u))*var(--u));overflow-wrap:anywhere}
.sol-objs{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.sol-o{flex:1 1 200px;min-width:0;border:1px solid var(--rule);border-radius:12px;padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px}
.sol-v{display:flex;flex-direction:column;gap:4px;font-size:calc(calc(13px*var(--u))*var(--u));color:var(--ink-2)}
.sol-ans{display:flex;flex-direction:column;gap:8px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin:6px 0 12px}
.sol-ans small{font-weight:700;color:var(--accent);font-size:calc(calc(13px*var(--u))*var(--u))}
.sol-res{display:flex;flex-direction:column;gap:2px;min-width:0}
.sol-res .k{color:var(--ink-2);font-size:calc(calc(14px*var(--u))*var(--u))}
.sol-res b{font-size:calc(calc(18px*var(--u))*var(--u));overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.sol-res.main b{font-size:calc(calc(24px*var(--u))*var(--u))}
.sol .proof li{overflow-wrap:anywhere}
.work{margin-top:16px;min-height:calc(220px*var(--k));border:2px dashed var(--rule);border-radius:14px;padding:8px 12px}.work small{color:var(--ink-2);font-weight:600}
.sol-o{flex-direction:row;flex-wrap:wrap}.sol-o legend{flex:none}.sol-v{flex:1 1 90px;min-width:0}
</style>

<div class="app">
  <header class="top">
    <div class="wrap top-in">
      <div class="brand">
        <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
          <path d="M3 25l9-12h21l-9 12z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M18 3v31" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="18" cy="19" r="2.6" fill="var(--ink)"/>
        </svg>
        <div class="brand-txt"><div class="brand-t" id="bt"></div><div class="brand-s" id="bs"></div></div>
      </div>

/* polyhedra */
function ngon(n,r,y,rot){var a=[],k,t;for(k=0;k<n;k++){t=rot+2*Math.PI*k/n;a.push([r*Math.cos(t),y,r*Math.sin(t)]);}return a;}
function poly(V,F,names){return {k:'poly',V:V,F:F,names:names};}
function boxPoly(hx,hy,hz,sx,sz){

/* ---------- vector helpers and angle marks ---------- */
function vadd(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
function vsub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function vmul(a,k){return [a[0]*k,a[1]*k,a[2]*k];}
function vdot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function vcross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function vlen(a){return Math.sqrt(vdot(a,a));}
function vunit(a){var l=vlen(a)||1;return vmul(a,1/l);}
function angDeg(a,b){var c=vdot(a,b)/(vlen(a)*vlen(b));return Math.acos(Math.max(-1,Math.min(1,c)))/D;}

ITEMS.r3={tag:'§12',
 title:{ru:'Расстояние от точки до плоскости',kk:'Нүктеден жазықтыққа дейінгі қашықтық'},
 stmt:{ru:'Через точку A, не лежащую в плоскости β, проведём прямую, перпендикулярную β, и обозначим точку пересечения B. Отрезок AB — перпендикуляр, его длина — расстояние от точки A до плоскости β.',
       kk:'β жазықтығында жатпайтын A нүктесі арқылы осы жазықтыққа перпендикуляр түзу жүргізіп, оның жазықтықпен қиылысу нүктесін B деп белгілейік. AB кесіндісі — A нүктесінен β жазықтығына түсірілген перпендикуляр, оның ұзындығы — A нүктесінен β жазықтығына дейінгі қашықтық.'},
 defs:{ru:['Расстояние от A до β — наименьшее из расстояний от A до точек плоскости β.','Высота пирамиды — перпендикуляр, проведённый из вершины к плоскости основания.'],
       kk:['A нүктесінен β жазықтығына дейінгі қашықтық — A-дан β жазықтығының нүктелеріне дейінгі қашықтықтардың ең кішісі.','Пирамиданың төбесінен табан жазықтығына түсірілген перпендикуляр пирамиданың биіктігі деп аталады.']},
 sym:{ru:'ρ(A, β) = AB,  AB ⊥ β',kk:'ρ(A, β) = AB,  AB ⊥ β'},
 real:{ru:'Высота лампы над полом; высота опоры над землёй.',kk:'Шамның еденнен биіктігі; тіректің жерден биіктігі.'},
 def:'one',v0:{yaw:-.55,pitch:.35},
 modes:[{id:'one',ru:'Перпендикуляр и наклонная',kk:'Перпендикуляр және көлбеу',cap:null}],
 slider:{min:0,max:40,def:30,sym:'BC',unit:'',fmt:dec1},
 dyn:function(v,L){var bc=v.n/10,ac=sq2(16+bc*bc);return 'AB = 4, BC = '+fmtN(bc,1)+' ⇒ AC = √(16 + '+fmtN(bc*bc,2)+') ≈ '+fmtN(ac,2)+(bc>0?' > 4.':'.');},
 build:function(m,v){
  var A=[0,.9,0],B=[0,-.6,0],C=[v.n/10*.35,-.6,0],o=[pl([[-1.5,-.6,-1],[1.5,-.6,-1],[1.5,-.6,1],[-1.5,-.6,1]],'a','β',2),ln(A,B,{c:'accent',w:3})];
  if(v.n>0)o.push(ln(A,C,{c:'ink',w:2}),pt(C,'C',{o:[8,16]}));
  o.push(rightAt(B,vsub(A,B),[1,0,0],.16),pt(A,'A',{o:[10,-8]}),pt(B,'B',{o:[-16,16]}));
  return o;
 }};

 title:{ru:'Скрещивающиеся прямые и общий перпендикуляр',kk:'Айқас түзулер және ортақ перпендикуляр',},
 stmt:{ru:'Общим перпендикуляром скрещивающихся прямых называется отрезок, перпендикулярный каждой из них, концы которого лежат на этих прямых. Его длина — расстояние между скрещивающимися прямыми.',
       kk:'Айқас түзулердің ортақ перпендикуляры деп осы түзулердің қайсысына да перпендикуляр болатын, ұштары осы түзулерде жататын кесіндіні айтады. Ортақ перпендикулярдың ұзындығы айқас түзулердің арақашықтығы деп аталады.'},
 sym:{ru:'ρ(AA₁, BD₁) = EF = a√2 / 2   (E, F — середины AA₁ и BD₁)',kk:'ρ(AA₁, BD₁) = EF = a√2 / 2   (E, F — AA₁ және BD₁ кесінділерінің ортасы)'},
 extra:{ru:'При a = 1 получаем √2/2 ≈ 0,7071 (пример 1 учебника).',kk:'a = 1 болғанда √2/2 ≈ 0,7071 шығады (оқулықтағы 1-мысал).'},
 real:{ru:'Расстояние между вертикальной стойкой и диагональной растяжкой, не пересекающей её.',kk:'Тік тірек пен оны қиып өтпейтін диагональды керме арасындағы қашықтық.'},
 proof:[
  {ru:'EF соединяет середины AA₁ и BD₁ (центр куба). EF ∥ AC.',kk:'EF кесіндісі AA₁ және BD₁ кесінділерінің орталарын (куб центрін) қосады. EF ∥ AC.'},
  {ru:'AC ⊥ BDD₁, поэтому EF ⊥ плоскости BDD₁ и EF ⊥ BD₁; EF ⊥ AA₁, так как EF лежит в плоскости, перпендикулярной AA₁.',kk:'AC ⊥ BDD₁, сондықтан EF ⊥ BDD₁ жазықтығы және EF ⊥ BD₁; EF ⊥ AA₁, өйткені EF түзуі AA₁-ге перпендикуляр жазықтықта жатыр.'},
  {ru:'EF = AO = a√2/2 (половина диагонали грани).',kk:'EF = AO = a√2/2 (жақ диагоналінің жартысы).'}],
 def:'one',v0:{yaw:-.6,pitch:.45},
 modes:[{id:'one',ru:'Общий перпендикуляр EF',kk:'Ортақ перпендикуляр EF',cap:null}],
 slider:{min:10,max:40,def:10,sym:'a',unit:'',fmt:dec1},
 dyn:function(v,L){var a=v.n/10;return 'a = '+fmtN(a,1)+':  EF = '+fmtN(a,1)+'·√2/2 ≈ '+fmtN(a*sq2(2)/2,3)+'.';},
 build:function(m,v){
  var P=cubeP(),V=P.V,E=mid(V[0],V[4]),F=mid(V[1],V[7]);
  P.ov=[ln(V[0],V[4],{c:'c',w:2.8}),ln(V[1],V[7],{c:'b',w:2.8}),ln(E,F,{c:'accent',w:3}),pt(E,'E',{o:[-16,4]}),pt(F,'F',{o:[10,-10]})];
  return [P];
 }};

ITEMS.r10={tag:'§14',
 title:{ru:'Как найти расстояние между скрещивающимися прямыми',kk:'Айқас түзулердің арақашықтығын қалай табамыз',},
 stmt:{ru:'Через прямую b проведём плоскость β, параллельную a: для этого через точку b проводим a′ ∥ a. Общий перпендикуляр AB скрещивающихся прямых перпендикулярен β, поэтому ρ(a, b) равно расстоянию от a до плоскости β.',
       kk:'a және b — айқас түзулер. b түзуінің қандай да бір нүктесі арқылы a-ға параллель a′ түзуін жүргіземіз. a′ және b түзулері a-ға параллель β жазықтығын анықтайды. AB ортақ перпендикуляры β жазықтығына перпендикуляр болады, демек оның ұзындығы a түзуі мен β жазықтығының арақашықтығына тең.'},
 sym:{ru:'a ∥ β,  b ⊂ β  ⇒  ρ(a, b) = ρ(a, β) = AB',kk:'a ∥ β,  b ⊂ β  ⇒  ρ(a, b) = ρ(a, β) = AB'},
 real:{ru:'Расстояние между двумя трубами, идущими на разных этажах под углом друг к другу.',kk:'Әртүрлі қабаттарда бір-біріне бұрыш жасай орналасқан екі құбырдың арақашықтығы.'},
 def:'one',v0:{yaw:-.7,pitch:.45},
 modes:[{id:'one',ru:'Плоскость β ∥ a',kk:'β ∥ a жазықтығы',cap:null}],
 slider:{min:20,max:160,def:70,sym:'φ',unit:'°'},
 dyn:function(v,L){var f=v.n,g=f>90?180-f:f;return L==='ru'?('∠(a, b) = '+g+'°, но AB = ρ(a, β) = 4 при любом угле.'):('∠(a, b) = '+g+'°, бірақ кез келген бұрышта AB = ρ(a, β) = 4.');},
 build:function(m,v){
  var th=v.n*D,A=[0,.6,0],B=[0,-.6,0],d=[Math.cos(th),0,Math.sin(th)];
  return [pl([[-1.5,-.6,-1.1],[1.5,-.6,-1.1],[1.5,-.6,1.1],[-1.5,-.6,1.1]],'a','β',2),
   ln(vadd(A,vmul(d,-1.0)),vadd(A,vmul(d,1.0)),{c:'c',w:2.8,lab:'a',le:'b',lo:[8,-8]}),
   ln(vadd(B,vmul(d,-1.3)),vadd(B,vmul(d,1.3)),{c:'faint',w:1.8,d:1,lab:'a′',le:'a',lo:[-18,14]}),
   ln([-1.5,-.6,0],[1.5,-.6,0],{c:'b',w:2.8,lab:'b',le:'b',lo:[-6,18]}),
   ln(A,B,{c:'accent',w:3}),rightAt(B,vsub(A,B),[1,0,0],.16),pt(A,'A',{o:[10,-8]}),pt(B,'B',{o:[-18,14]})];
 }};

ITEMS.r11={tag:'§14',
 title:{ru:'Пример: правильная шестиугольная призма',kk:'Мысал: дұрыс алтыбұрышты призма',},
 stmt:{ru:'В правильной шестиугольной призме ABCDEFA₁B₁C₁D₁E₁F₁ все рёбра равны a. Найдите расстояние между прямыми AA₁ и BE₁.',
       kk:'ABCDEFA₁B₁C₁D₁E₁F₁ дұрыс алтыбұрышты призмасының барлық қырлары a-ға тең. AA₁ және BE₁ түзулерінің арақашықтығын табыңдар.'},
 sym:{ru:'AA₁ ∥ BEE₁,  ρ(AA₁, BE₁) = ρ(A, BE) = AH = a√3 / 2',kk:'AA₁ ∥ BEE₁,  ρ(AA₁, BE₁) = ρ(A, BE) = AH = a√3 / 2'},
 extra:{ru:'При a = 1 получаем √3/2 ≈ 0,8660.',kk:'a = 1 болғанда √3/2 ≈ 0,8660 шығады.'},
 real:{ru:'Расстояние между колонной и растяжкой в шестигранной башне.',kk:'Алты қырлы мұнарадағы бағана мен керме арасындағы қашықтық.'},
 proof:[
  {ru:'AA₁ ∥ BB₁, поэтому AA₁ ∥ плоскости BEE₁, и искомое расстояние равно расстоянию между AA₁ и этой плоскостью.',kk:'AA₁ ∥ BB₁, сондықтан AA₁ ∥ BEE₁ жазықтығына, ізделінді қашықтық AA₁ мен осы жазықтықтың арақашықтығына тең.'},
  {ru:'Оно равно расстоянию от A до прямой BE в основании: AH ⊥ BE.',kk:'Ол табандағы A нүктесінен BE түзуіне дейінгі қашықтыққа тең: AH ⊥ BE.'},
  {ru:'В треугольнике ABO (O — центр шестиугольника) AB = BO = a, угол 60°, AH = a·sin 60° = a√3/2.',kk:'ABO үшбұрышында (O — алтыбұрыштың центрі) AB = BO = a, бұрышы 60°, AH = a·sin 60° = a√3/2.'}],
 def:'one',v0:{yaw:-.5,pitch:.5},
 modes:[{id:'one',ru:'Перпендикуляр AH',kk:'AH перпендикуляры',cap:null}],
 slider:{min:10,max:40,def:10,sym:'a',unit:'',fmt:dec1},
 dyn:function(v,L){var a=v.n/10;return 'a = '+fmtN(a,1)+':  AH = '+fmtN(a,1)+'·√3/2 ≈ '+fmtN(a*sq2(3)/2,3)+'.';},
 build:function(m,v){
  var P=prismPoly(6,false),V=P.V,Av=V[0],Bv=V[1],Ev=V[4],u=vunit(vsub(Ev,Bv)),H=vadd(Bv,vmul(u,vdot(vsub(Av,Bv),u)));
  P.ov=[pl([V[1],V[4],V[10],V[7]],'a'),ln(V[0],V[6],{c:'c',w:2.8}),ln(V[1],V[10],{c:'b',w:2.4}),ln(V[1],V[4],{c:'faint',w:1.6,d:1}),ln(Av,H,{c:'accent',w:3}),rightAt(H,vsub(Av,H),u,.12),pt(H,'H',{o:[8,16]})];
  return [P];
 }};

/* ================= tab 2: dihedral angle (§17) ================= */
function halfPlane(phi,col,lab){
 var e=[0,Math.sin(phi*D),Math.cos(phi*D)];
 return pl([[-1.25,0,0],[1.25,0,0],vadd([1.25,0,0],vmul(e,1.15)),vadd([-1.25,0,0],vmul(e,1.15))],col,lab,2);
}
ITEMS.d1={tag:'§17',
 title:{ru:'Двугранный угол',kk:'Екіжақты бұрыш'},
 stmt:{ru:'Двугранным углом называется фигура в пространстве, образованная двумя полуплоскостями с общей граничной прямой и одной из частей пространства, ограниченной этими полуплоскостями. Полуплоскости — грани, их общая прямая — ребро двугранного угла.',
       kk:'Екіжақты бұрыш деп ортақ бір түзумен шектелген екі жартыжазықтықтан және кеңістіктің осы жартыжазықтықтармен шектелген бөлігінен тұратын фигураны айтады. Жартыжазықтықтарды екіжақты бұрыштың жақтары, ал оларды шектейтін түзуді қыры деп атайды.'},
 defs:{ru:['Линейный угол: плоскость γ ⊥ c пересекает грани по лучам a₁, b₁; угол между ними — линейный угол двугранного угла.','Величина двугранного угла — величина его линейного угла, принадлежит промежутку (0°; 180°].','Двугранный угол прямой, острый или тупой, как и его линейный угол.'],
       kk:['Сызықтық бұрыш: c-ға перпендикуляр γ жазықтығы жақтарды a₁, b₁ сәулелері бойынша қиды; олардың арасындағы бұрыш — екіжақты бұрыштың сызықтық бұрышы.','Екіжақты бұрыштың шамасы — оның сызықтық бұрышының шамасы, (0°; 180°] аралығында жатады.','Екіжақты бұрыш та сызықтық бұрышы сияқты тік, сүйір немесе доғал болады.']},
 sym:{ru:'α c β — двугранный угол;  φ = ∠a₁Ob₁,  0° < φ ≤ 180°',kk:'α c β — екіжақты бұрыш;  φ = ∠a₁Ob₁,  0° < φ ≤ 180°'},
 real:{ru:'Приоткрытая книга, крыша дома, открытая дверь: между гранями образуется двугранный угол.',kk:'Ашылған кітап, үй төбесі, ашық есік: жақтарының арасында екіжақты бұрыш пайда болады.'},
 def:'one',v0:{yaw:-.7,pitch:.35},
 modes:[{id:'one',ru:'Линейный угол',kk:'Сызықтық бұрыш',cap:null}],
 slider:{min:10,max:170,def:70,sym:'φ',unit:'°'},
 dyn:function(v,L){
  var f=v.n,k=f<90?{ru:'острый',kk:'сүйір'}:(f===90?{ru:'прямой',kk:'тік'}:{ru:'тупой',kk:'доғал'});
  return L==='ru'?('Линейный угол a₁Ob₁ равен '+f+'°. Двугранный угол '+k.ru+'.'):('a₁Ob₁ сызықтық бұрышы '+f+'°-қа тең. Екіжақты бұрыш '+k.kk+'.');
 },
 build:function(m,v){
  var O=[.1,0,0],e=[0,Math.sin(v.n*D),Math.cos(v.n*D)];
  return [halfPlane(0,'a','α'),halfPlane(v.n,'b','β'),ln([-1.4,0,0],[1.4,0,0],{c:'accent',w:2.8,lab:'c',le:'b',lo:[10,-12]}),
   ln(O,vadd(O,[0,0,1.0]),{c:'ink',w:2,lab:'a₁',le:'b',lo:[8,10]}),ln(O,vadd(O,vmul(e,1.0)),{c:'ink',w:2,lab:'b₁',le:'b',lo:[10,-8]}),
   ang(O,[0,0,1],e,{r:.5,sq:v.n===90,lab:v.n+'°'}),pt(O,'O',{o:[-12,12]})];
 }};

ITEMS.d2={tag:'§17',
 title:{ru:'Линейный угол не зависит от выбора',kk:'Сызықтық бұрыш таңдауға байланысты емес'},
 stmt:{ru:'Величина линейного угла двугранного угла не зависит от того, в какой точке ребра и какой плоскостью, перпендикулярной ребру, он построен. Поэтому величина двугранного угла определена корректно.',
       kk:'Екіжақты бұрыштың сызықтық бұрышының шамасы қырдың қай нүктесінде және қырға перпендикуляр қай жазықтықпен салынғанына байланысты емес. Сондықтан екіжақты бұрыштың шамасы дұрыс анықталған.'},
 sym:{ru:'γ₁ ⊥ c, γ₂ ⊥ c  ⇒  ∠a₁Ob₁ = ∠a₂O′b₂',kk:'γ₁ ⊥ c, γ₂ ⊥ c  ⇒  ∠a₁Ob₁ = ∠a₂O′b₂'},
 real:{ru:'Угол раскрытия книги один и тот же в любом месте корешка.',kk:'Кітаптың ашылу бұрышы омыртқаның кез келген жерінде бірдей.'},
 proof:[
  {ru:'Пусть γ₁ и γ₂ — плоскости, перпендикулярные ребру c. Они пересекают грани a и b по лучам a₁, a₂ и b₁, b₂.',kk:'γ₁ және γ₂ — c қырына перпендикуляр жазықтықтар. Олар a және b жақтарын a₁, a₂ және b₁, b₂ сәулелері бойынша қиды.'},
  {ru:'Лучи a₁ и a₂ лежат в одной полуплоскости и перпендикулярны одной прямой c, поэтому они сонаправлены. То же верно для b₁ и b₂.',kk:'a₁ және a₂ сәулелері бір жартыжазықтықта жатады және бір c түзуіне перпендикуляр, сондықтан бағыттас. b₁ және b₂ үшін де солай.'},
  {ru:'Углы с сонаправленными сторонами равны, значит, линейные углы равны.',kk:'Бағыттас қабырғалары бар бұрыштар тең, демек сызықтық бұрыштар тең.'}],
 def:'two',v0:{yaw:-.7,pitch:.35},
 modes:[{id:'one',ru:'Одно сечение',kk:'Бір қима',cap:null},{id:'two',ru:'Два сечения',kk:'Екі қима',cap:null}],
 slider:{min:10,max:170,def:110,sym:'φ',unit:'°'},
 dyn:function(v,L){
  return v.mode==='one'?(L==='ru'?'Плоскость γ₁ ⊥ c даёт линейный угол '+v.n+'°.':'γ₁ ⊥ c жазықтығы '+v.n+'° сызықтық бұрыш береді.'):
   (L==='ru'?'Во второй точке ребра линейный угол тоже '+v.n+'°: лучи сонаправлены.':'Қырдың екінші нүктесінде де сызықтық бұрыш '+v.n+'°: сәулелер бағыттас.');
 },
 build:function(m,v){
  var e=[0,Math.sin(v.n*D),Math.cos(v.n*D)],o=[halfPlane(0,'a','α'),halfPlane(v.n,'b','β'),ln([-1.4,0,0],[1.4,0,0],{c:'accent',w:2.8,lab:'c',le:'b',lo:[10,-12]})],
      pts=m==='two'?[[.7,0,0],[-.6,0,0]]:[[.1,0,0]];
  pts.forEach(function(O,i){
   o.push(ln(O,vadd(O,[0,0,.95]),{c:'ink',w:2}),ln(O,vadd(O,vmul(e,.95)),{c:'ink',w:2}),ang(O,[0,0,1],e,{r:.45,sq:v.n===90,lab:v.n+'°'}),pt(O,i?'O′':'O',{o:[-12,12]}));
  });
  return o;
 }};

function pyrH(h){
 var s=.8,H=h*.8,yb=-H/2,yt=H/2,P=poly([[-s,yb,s],[s,yb,s],[s,yb,-s],[-s,yb,-s],[0,yt,0]],[[0,1,2,3],[0,1,4],[1,2,4],[2,3,4],[3,0,4]],['A','B','C','D','S']),
     O=[0,yb,0],E=[s,yb,0],S=[0,yt,0];
 P.ov=[dashed(S,O,'c'),dashed(O,E,'c'),ln(S,E,{c:'b',w:2.6}),pt(O,'O',{o:[-12,12]}),pt(E,'E',{o:[14,10]}),rightAt(O,vsub(S,O),vsub(E,O),.14),ang(E,vsub(O,E),vsub(S,E),{r:.3,lab:'φ'})];
 return P;
}
ITEMS.d3={tag:'§17',
 title:{ru:'Двугранный угол при основании пирамиды',kk:'Пирамида табанындағы екіжақты бұрыш'},
 stmt:{ru:'В правильной четырёхугольной пирамиде SABCD сторона основания равна 2, высота SO = h. Проведём высоту SE боковой грани SBC. Угол SEO — линейный угол двугранного угла между боковой гранью и основанием.',
       kk:'Дұрыс төртбұрышты SABCD пирамидасында табанының қабырғасы 2-ге тең, биіктігі SO = h. SBC бүйір жағының SE биіктігін жүргіземіз. SEO бұрышы — бүйір жақ пен табан арасындағы екіжақты бұрыштың сызықтық бұрышы.'},
 sym:{ru:'tg φ = SO : OE = h : 1',kk:'tg φ = SO : OE = h : 1'},
 extra:{ru:'При h = 1 получаем катеты SO = EO = 1 и угол 45° (пример 1 учебника).',kk:'h = 1 болғанда SO = EO = 1 катеттері және 45° бұрыш шығады (оқулықтағы 1-мысал).'},
 real:{ru:'Склон крыши-пирамиды и стена: чем выше крыша, тем круче боковая грань.',kk:'Пирамида пішінді шатыр беткейі: шатыр биік болған сайын бүйір жағы тіктеу болады.'},
 def:'one',v0:{yaw:-.5,pitch:.4},
 modes:[{id:'one',ru:'Высота пирамиды',kk:'Пирамида биіктігі',cap:null}],
 slider:{min:3,max:30,def:10,sym:'h',unit:'',fmt:dec1},

 if(fig==='box'){

 }else{

  var b=[[0,0]],dir=0,k;
  if(n===3){b=[[0,0],[a,0],[a/2,a*Math.sqrt(3)/2]];}
  else{for(k=1;k<n;k++){b.push([b[k-1][0]+a*Math.cos(dir*D),b[k-1][1]+a*Math.sin(dir*D)]);dir+=60;}}
  V=b.map(function(q){return [q[0],q[1],0];}).concat(b.map(function(q){return [q[0],q[1],h];}));
  for(i=0;i<n;i++)names.push('ABCDEF'.charAt(i));

  var f0=[],f1_=[];for(i=0;i<n;i++){f0.push(i);f1_.push(n+i);}F=[f0,f1_];
  for(i=0;i<n;i++)F.push([i,(i+1)%n,n+(i+1)%n,n+i]);
 }
 var mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
 V.forEach(function(q){for(i=0;i<3;i++){mn[i]=Math.min(mn[i],q[i]);mx[i]=Math.max(mx[i],q[i]);}});

function cs(v){return '('+v.map(function(x){return fmtN(x,3);}).join('; ')+')';}
function gcd(a,b){return b?gcd(b,a%b):a;}
function exactStr(x2){
 if(!isFinite(x2))return null;
 if(Math.abs(x2)<1e-12)return '0';
 var den,m;
 for(den=1;den<=720;den++){m=x2*den;if(Math.abs(m-Math.round(m))<1e-8*Math.max(1,m)&&Math.round(m)>0)break;}
 if(den>720)return null;
 m=Math.round(m);
 var mn=m*den,k=1,r=mn,d;
 for(d=2;d*d<=r;d++){while(r%(d*d)===0){r/=d*d;k*=d;}}
 var g=gcd(k,den);k/=g;den/=g;
 if(r===1)return den===1?String(k):k+'/'+den;
 var top=(k===1?'':String(k))+'√'+r;
 return den===1?top:top+'/'+den;
}
function sqrtStr(x2,d){var e=exactStr(x2);return e?(/^\d+$/.test(e)?e:e+' ≈ '+fmtN(d,4)):'≈ '+fmtN(d,4);}
function lineDraw(P,Q,ts,col,w){
 var u=vsub(Q,P),t0=Math.min.apply(null,[0].concat(ts)),t1=Math.max.apply(null,[1].concat(ts)),o=[];
 if(t0<-1e-9)o.push(ln(vadd(P,vmul(u,t0)),P,{c:col,w:1.8,d:1}));
 if(t1>1+1e-9)o.push(ln(Q,vadd(P,vmul(u,t1)),{c:col,w:1.8,d:1}));

/* ---------- 3D rendering ---------- */
var S=108,CX=210,CY=150;
function proj(p,v){
 var cy=Math.cos(v.yaw),sy=Math.sin(v.yaw),cp=Math.cos(v.pitch),sp=Math.sin(v.pitch);
 var x1=p[0]*cy+p[2]*sy,z1=-p[0]*sy+p[2]*cy;
 var y2=p[1]*cp-z1*sp,z2=p[1]*sp+z1*cp;
 return {x:CX+x1*S,y:CY-y2*S,z:z2};
}
function f1(n){return n.toFixed(1);}
function polySVG(p,v){
 var cy=Math.cos(v.yaw),sy=Math.sin(v.yaw),cp=Math.cos(v.pitch),sp=Math.sin(v.pitch),i,R,c=[0,0,0];
 R=p.V.map(function(q){var x1=q[0]*cy+q[2]*sy,z1=-q[0]*sy+q[2]*cy;return [x1,q[1]*cp-z1*sp,q[1]*sp+z1*cp];});
 R.forEach(function(r){c[0]+=r[0];c[1]+=r[1];c[2]+=r[2];});
 c=c.map(function(x){return x/R.length;});
 var front=p.F.map(function(f){
  var a=R[f[0]],b=R[f[1]],d=R[f[2]],u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],w=[d[0]-a[0],d[1]-a[1],d[2]-a[2]];
  var n=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]],fc=[0,0,0];
  f.forEach(function(k){fc[0]+=R[k][0];fc[1]+=R[k][1];fc[2]+=R[k][2];});
  fc=fc.map(function(x){return x/f.length;});
  if(n[0]*(fc[0]-c[0])+n[1]*(fc[1]-c[1])+n[2]*(fc[2]-c[2])<0)n=[-n[0],-n[1],-n[2]];
  return n[2]>1e-6;
 });
 var sc=R.map(function(r){return {x:CX+r[0]*S,y:CY-r[1]*S};});
 var edges={},vis=R.map(function(){return false;});
 p.F.forEach(function(f,fi){
  for(i=0;i<f.length;i++){
   var a=f[i],b=f[(i+1)%f.length],k=a<b?a+'-'+b:b+'-'+a;
   if(!edges[k])edges[k]={a:a,b:b,vis:false};
   if(front[fi]){edges[k].vis=true;vis[a]=true;vis[b]=true;}
  }
 });
 var hid='',shown='',fills='',labels='',k,e;
 for(k in edges){
  e=edges[k];
  var seg='<line x1="'+f1(sc[e.a].x)+'" y1="'+f1(sc[e.a].y)+'" x2="'+f1(sc[e.b].x)+'" y2="'+f1(sc[e.b].y)+'"';
  if(e.vis)shown+=seg+' class="ln ln-ink" stroke-width="2"/>';
  else hid+=seg+' class="ln ln-faint" stroke-width="1.3" stroke-dasharray="5 5"/>';
 }
 p.F.forEach(function(f,fi){
  if(front[fi])fills+='<polygon class="pl-f" points="'+f.map(function(q){return f1(sc[q].x)+','+f1(sc[q].y);}).join(' ')+'"/>';
 });
 var mx=0,my=0;sc.forEach(function(s){mx+=s.x;my+=s.y;});mx/=sc.length;my/=sc.length;
 sc.forEach(function(s,idx){
  var dx=s.x-mx,dy=s.y-my,d=Math.sqrt(dx*dx+dy*dy)||1;
  labels+='<text class="lbl'+(vis[idx]?'':' lbl-h')+'" x="'+f1(Math.max(12,Math.min(408,s.x+dx/d*15)))+'" y="'+f1(Math.max(12,Math.min(288,s.y+dy/d*15)))+'">'+p.names[idx]+'</text>';
  if(vis[idx])labels+='<circle class="pt" cx="'+f1(s.x)+'" cy="'+f1(s.y)+'" r="3.6"/>';
 });
 return hid+fills+shown+(p.ov?renderPrims(p.ov,v):'')+labels;
}
function clampX(x){return Math.max(14,Math.min(406,x));}
function clampY(y){return Math.max(14,Math.min(286,y));}
function renderPrims(prims,v){
 var items=prims.map(function(p){
  if(p.k==='plane'){var q=p.pts.map(function(x){return proj(x,v)});return {p:p,q:q,z:q.reduce(function(s,a){return s+a.z},0)/q.length};}
  if(p.k==='line'){var a=proj(p.a,v),b=proj(p.b,v);return {p:p,a:a,b:b,z:(a.z+b.z)/2+.25};}
  if(p.k==='ang'){var o=proj(p.o,v);return {p:p,q:o,z:o.z+.35};}
  var r=proj(p.p,v);return {p:p,q:r,z:r.z+.5};
 }).sort(function(x,y){return x.z-y.z});
 var shapes='',labels='';
 function P2(a){return a.map(function(q){return f1(q.x)+','+f1(q.y);}).join(' ');}
 items.forEach(function(it){
  var p=it.p;
  if(p.k==='plane'){
   shapes+='<polygon class="pl-'+p.col+'" points="'+P2(it.q)+'"/>';
   if(p.lab){
    var cx=0,cy=0;it.q.forEach(function(a){cx+=a.x;cy+=a.y});cx/=it.q.length;cy/=it.q.length;
    var c=it.q[p.li],dx=c.x-cx,dy=c.y-cy,d=Math.sqrt(dx*dx+dy*dy)||1;
    labels+='<text class="lbl lbl-pl lbl-'+p.col+'" x="'+f1(clampX(c.x+dx/d*15))+'" y="'+f1(clampY(c.y+dy/d*15))+'">'+p.lab+'</text>';
   }
  }else if(p.k==='line'){

function setLine(s){
 var col=colorOf(s.c);
 ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';
}

 var w=ink.clientWidth,p=s.p.map(function(a){return [a[0]*w,a[1]]});

}

}
function pos(e){var r=ink.getBoundingClientRect();return [(e.clientX-r.left)/r.width,e.clientY-r.top];}

 if(s.line){var ax=s.p[0][0]*w,ay=s.p[0][1],bx=s.p[1][0]*w,by=s.p[1][1],vx=bx-ax,vy=by-ay,L2=vx*vx+vy*vy,t=L2?Math.max(0,Math.min(1,((x-ax)*vx+(y-ay)*vy)/L2)):0,px=ax+t*vx-x,py=ay+t*vy-y;return px*px+py*py<R*R;}

}
function eraseAt(e){

 for(var i=strokes.length-1;i>=0;i--){
  if(strokeHit(strokes[i],x,y,R,r.width))strokes.splice(i,1);

ink.addEventListener('pointerdown',function(e){

 if(pen.tool==='line'){cur={c:pen.color,w:SIZES[pen.size],p:[pos(e),pos(e)],line:1};strokes.push(cur);drawAll();return;}
 if(pen.tool==='pen'){
  cur={c:pen.color,w:SIZES[pen.size],p:[pos(e)]};strokes.push(cur);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var q=cur.p[0];setLine(cur);ctx.beginPath();ctx.arc(q[0]*ink.clientWidth,q[1],cur.w/2,0,6.2832);ctx.fill();

ink.addEventListener('pointermove',function(e){
 if(cur&&cur.line){var p0=pos(e),a0=cur.p[0],w0=ink.clientWidth,ddx=(p0[0]-a0[0])*w0,ddy=p0[1]-a0[1],g0=Math.atan2(Math.abs(ddy),Math.abs(ddx))/D;if(g0<3)p0[1]=a0[1];else if(g0>87)p0[0]=a0[0];cur.p[1]=p0;drawAll();return;}

  var p=pos(e),l=cur.p[cur.p.length-1],w=ink.clientWidth,dx=(p[0]-l[0])*w,dy=p[1]-l[1];

  ctx.beginPath();ctx.moveTo(l[0]*w,l[1]);ctx.lineTo(p[0]*w,p[1]);ctx.stroke();

<script>
/* subscript fallback: Unicode ₀-₉ -> real <sub>/<tspan> (fonts of some touch panels lack these glyphs) */
(function(){
var RE=/[₀-₉]+/, RG=/([₀-₉]+)/g, SV='http://www.w3.org/2000/svg';
function dig(s){return s.replace(/[₀-₉]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x2080+48);});}
function inSvg(n){var p=n.parentNode;while(p&&p.nodeType===1){if(p.namespaceURI===SV)return true;p=p.parentNode;}return false;}
function fix(t){
 var par=t.parentNode;if(!par||!RE.test(t.nodeValue))return;
 var tag=par.nodeName.toLowerCase();
 if(tag==='script'||tag==='style'||tag==='textarea')return;
 if(tag==='option'||tag==='title'){t.nodeValue=dig(t.nodeValue);return;}
 var parts=t.nodeValue.split(RG),frag=document.createDocumentFragment(),svg=inSvg(t),i,sub;
 for(i=0;i<parts.length;i++){
  if(!parts[i])continue;
  sub=(i%2===1);
  if(svg){
   var ts=document.createElementNS(SV,'tspan');
   if(sub){ts.setAttribute('dy','0.28em');ts.setAttribute('font-size','72%');ts.textContent=dig(parts[i]);}
   else{ts.textContent=parts[i];if(i>1)ts.setAttribute('dy','-0.28em');}
   frag.appendChild(ts);
  }else if(sub){var s=document.createElement('sub');s.className='sbx';s.textContent=dig(parts[i]);frag.appendChild(s);}
  else frag.appendChild(document.createTextNode(parts[i]));
 }
 par.replaceChild(frag,t);
}
function walk(n){
 if(n.nodeType===3){fix(n);return;}
 if(n.nodeType!==1)return;
 var w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,null),a=[],x;
 while((x=w.nextNode()))if(RE.test(x.nodeValue))a.push(x);
 a.forEach(fix);
}
var st=document.createElement('style');st.textContent='sub.sbx{font-size:.72em;line-height:0;vertical-align:baseline;position:relative;top:.28em}';document.head.appendChild(st);
var busy=false;
new MutationObserver(function(ms){
 if(busy)return;busy=true;
 ms.forEach(function(m){
  if(m.type==='characterData')fix(m.target);
  else m.addedNodes.forEach(walk);
 });
 busy=false;
}).observe(document.body||document.documentElement,{childList:true,subtree:true,characterData:true});
walk(document.body||document.documentElement);
})();
</script>
